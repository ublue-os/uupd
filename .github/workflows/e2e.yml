name: e2e testing
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
  merge_group:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  e2e:
    name: E2E Test uupd on ${{ matrix.image.name }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image:
              name: bazzite
            base_image: ghcr.io/ublue-os/bazzite:stable
          - image:
              name: aurora
            base_image: ghcr.io/ublue-os/aurora:stable
          - image:
              name: bluefin
            base_image: ghcr.io/ublue-os/bluefin:stable
          - image:
              name: fedora-bootc-rawhide
            base_image: ghcr.io/fedora/fedora-bootc:rawhide
          - image:
              name: dakota
            base_image: ghcr.io/projectbluefin/dakota:stable

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install deps
        run: |
          # Install just (required by container-rpm-build)
          sudo apt-get update
          sudo apt-get install -y just
          
          # Add plucky repos for Ubuntu 24.04 to get newer packages
          if [ "$(dpkg --print-architecture)" = "amd64" ]; then
            echo "deb http://archive.ubuntu.com/ubuntu plucky universe main" | sudo tee /etc/apt/sources.list.d/plucky.list
          else
            echo "deb http://ports.ubuntu.com/ubuntu-ports plucky universe main" | sudo tee /etc/apt/sources.list.d/plucky.list
          fi
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          
          # Install base dependencies
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades qemu-system-x86 || qemu-system-x86-hwe libvirt-daemon-system podman rsync
          
          # Install tmt via pip
          pip3 install --break-system-packages tmt

      - name: Build uupd RPM
        run: |
          make build-package

      - name: Build test container image
        run: |
          podman build \
            -t localhost/uupd-test \
            --build-arg BASE_IMAGE=${{ matrix.base_image }} \
            -f tests/e2e/Containerfile.e2e \
            .

      - name: Run e2e tests
        run: |
          tmt run -a plan --name "e2e/${{ matrix.image.name }}" --debug
