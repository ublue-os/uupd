name: e2e testing
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
  merge_group:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Test uupd on ${{ matrix.image.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: bluefin
          - name: aurora
          - name: bazzite
          - name: dakota

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up bootc host (KVM/libvirt/virtiofsd)
        uses: bootc-dev/actions/bootc-host-setup@main
        with:
          libvirt: 'true'

      - name: Install bcvk (>= 0.22 required for --update-from-host)
        run: |
          sudo systemctl enable --now libvirtd
          sudo systemctl stop apparmor 2>/dev/null || true
          sudo systemctl disable apparmor 2>/dev/null || true

          BCVK_VERSION="0.22.0"
          BCVK_TARBALL="bcvk-x86_64-unknown-linux-gnu.tar.gz"
          BCVK_URL="https://github.com/bootc-dev/bcvk/releases/download/v${BCVK_VERSION}"
          curl -fsSL -o "$BCVK_TARBALL" "${BCVK_URL}/${BCVK_TARBALL}"
          curl -fsSL -o "${BCVK_TARBALL}.sha256" "${BCVK_URL}/${BCVK_TARBALL}.sha256"
          sha256sum -c "${BCVK_TARBALL}.sha256"
          tar -xzf "$BCVK_TARBALL"
          sudo install -m 0755 bcvk-x86_64-unknown-linux-gnu /usr/local/bin/bcvk
          bcvk --version

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            sudo podman login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Build uupd
        run: make build

      - name: Run e2e test
        run: sudo ./tests/e2e/e2e.sh '${{ matrix.image.name }}'
